name: Enumerate exact Variety opening schedule
on:
  push:
    paths:
      - '.github/workflows/variety-schedule.yml'
  workflow_dispatch:
jobs:
  enumerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess and acquire publicly released Variety.bin
        run: |
          python -m pip install python-chess
          curl -fLsS --retry 3 -o Variety.zip https://github.com/ChrisWhittington/polyglot-books/releases/download/v1.0/Variety.zip
          unzip -o Variety.zip
          test -f Variety.bin
      - name: Enumerate each legal opening line in published book
        run: python -u enumerate_variety.py
      - name: Save full schedule and checksums
        uses: actions/upload-artifact@v4
        with:
          name: variety-exact-opening-schedule
          path: |
            opening_lines.jsonl
            opening_schedule_summary.json
