name: Public hosted runner eligibility check
on:
  push:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm off-PC machine allocation
        run: |
          echo "CLOUD_RUNNER_ACTIVE $(hostname)"
          uname -a
          nproc
          sudo apt-get update -qq
          sudo apt-get install -y mame
          /usr/games/mame -version
          /usr/games/mame -listfull mmirage
