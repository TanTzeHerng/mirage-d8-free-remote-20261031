name: Fresh Claude Mirage D8 vs Beast 1-node with live PGNs
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
concurrency:
  group: fresh-claude-mirage-beast
  cancel-in-progress: false
jobs:
  match:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install chess arbiter and restore only Beast-match checkpoints
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python -m pip install python-chess
          id=$(gh api "repos/$REPO/actions/artifacts?name=claude-mirage-beast-real-games&per_page=100" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .id // empty')
          if [ -n "$id" ]; then
            gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$id/zip" > /tmp/beast-previous.zip
            unzip -o /tmp/beast-previous.zip -d .
          else
            echo "FRESH_BEAST_MATCH_NO_PREVIOUS_RESULTS"
          fi
          python -u beast_match/restore.py
      - name: Restore genuine Mirage G79 ROM
        env:
          ROM_B64: ${{ secrets.MIRAGE_ROM_B64 }}
        run: |
          set -euo pipefail
          test -n "$ROM_B64"
          mkdir -p mame/roms
          printf '%s' "$ROM_B64" | base64 -d > mame/roms/mmirage.zip
          python - <<'PY'
          import pathlib,zipfile
          with zipfile.ZipFile('mame/roms/mmirage.zip') as z:
              matches=[x for x in z.infolist() if x.file_size==32768 and 'g79' in x.filename.lower()]
              assert len(matches)==1,'G79 firmware absent or ambiguous'
              pathlib.Path('claude_fast_native/g79').write_bytes(z.read(matches[0]))
          PY
      - name: Verify full Variety opening book
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 -o Variety.zip https://github.com/ChrisWhittington/polyglot-books/releases/download/v1.0/Variety.zip
          unzip -o Variety.zip
          echo '5a30bc27b5e7b7d51694bf35e7d5dd2536b54e9b25ea3ea64ef4a2b982d5e21c  Variety.bin' | sha256sum -c -
          python -u enumerate_variety.py
          grep -q '"leaf_openings": 81523' opening_schedule_summary.json
      - name: Decrypt exact user's Beast network and verify SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          BEAST_AES256_HEX: ${{ secrets.BEAST_AES256_HEX }}
        run: |
          set -euo pipefail
          test -n "$BEAST_AES256_HEX" || { echo "BEAST_NETWORK_NOT_STAGED"; exit 42; }
          gh release download beast-net-encrypted-20261105 --repo "$GITHUB_REPOSITORY" --pattern 'Beast.pb.gz.aesgcm' --clobber
          python -m pip install 'cryptography>=42'
          python - <<'PY'
          import os,pathlib,hashlib
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          payload=pathlib.Path('Beast.pb.gz.aesgcm').read_bytes()
          key=bytes.fromhex(os.environ['BEAST_AES256_HEX'])
          assert len(key)==32 and len(payload)>28
          net=AESGCM(key).decrypt(payload[:12],payload[12:],None)
          expected='394d1ca773b41e9f88f3993befd4a5c3a45eb6d7bcc5320a6ecca441625298cf'
          assert hashlib.sha256(net).hexdigest()==expected,'Beast network SHA mismatch'
          pathlib.Path('Beast.pb.gz').write_bytes(net)
          print('BEAST_ORIGINAL_NETWORK_SHA256_VERIFIED',expected)
          PY
          rm -f Beast.pb.gz.aesgcm
      - uses: actions/cache@v4
        with:
          path: beast_match/lc0
          key: lc0-v0.32.1-openblas-ubuntu2404-20261105
      - name: Build Leela Chess Zero official CPU engine
        run: |
          set -euo pipefail
          if [ ! -x beast_match/lc0 ]; then
            sudo apt-get update -qq
            sudo apt-get install -y libopenblas-dev libprotobuf-dev protobuf-compiler pkg-config ninja-build meson zlib1g-dev libeigen3-dev
            git clone --recurse-submodules --depth 1 --branch v0.32.1 https://github.com/LeelaChessZero/lc0.git /tmp/lc0
            cd /tmp/lc0
            ./build.sh -Dgtest=false -Donnx=false -Dispc=false -Dopencl=false -Dcudnn=false -Dplain_cuda=false -Dblas=true -Dopenblas=true
            cp build/release/lc0 "$GITHUB_WORKSPACE/beast_match/lc0"
          fi
          beast_match/lc0 --version || beast_match/lc0 --help | head
      - name: Build Claude's genuine native Mirage firmware runner
        run: |
          g++ -O3 -march=native -std=gnu++17 -pthread -o claude_fast_native/mm_game_driver claude_fast_native/mm_game_driver.cpp claude_fast_native/mm_core.cpp
          python -m py_compile beast_match_runner.py beast_match/live_sync.py beast_match/restore.py
      - name: Eight concurrently replenished D8 vs Beast 1-node games
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          BEAST_BINARY: ${{ github.workspace }}/beast_match/lc0
          BEAST_NET: ${{ github.workspace }}/Beast.pb.gz
          MIRAGE_NATIVE_BINARY: ${{ github.workspace }}/claude_fast_native/mm_game_driver
          MIRAGE_NATIVE_ROM: ${{ github.workspace }}/claude_fast_native/g79
        run: |
          set -euo pipefail
          mkdir -p match_beast_data
          python -u beast_match/live_sync.py --watch --interval 15 > match_beast_data/live_pgn_publisher.log 2>&1 &
          SYNC_PID=$!
          cleanup() {
            kill "$SYNC_PID" 2>/dev/null || true
            wait "$SYNC_PID" 2>/dev/null || true
            python -u beast_match/live_sync.py || true
          }
          trap cleanup EXIT
          python -u beast_match_runner.py
      - name: Save genuine chess results and recoverable game checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-mirage-beast-real-games
          retention-days: 90
          if-no-files-found: warn
          path: |
            match_beast_data/
            opening_schedule_summary.json
