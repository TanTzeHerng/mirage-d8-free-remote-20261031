name: Validate Claude native ultra-fast Mirage D8
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirage-native-fast-preflight.yml'
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Restore original Mirage G79 firmware (not published)
        env:
          ROM_B64: ${{ secrets.MIRAGE_ROM_B64 }}
        run: |
          set -euo pipefail
          test -n "$ROM_B64"
          mkdir -p mame/roms
          printf '%s' "$ROM_B64" | base64 -d > mame/roms/mmirage.zip
          python - <<'PY'
          import zipfile, pathlib
          z=zipfile.ZipFile('mame/roms/mmirage.zip')
          matches=[x for x in z.infolist() if x.file_size==32768 and 'g79' in x.filename.lower()]
          print('G79_MATCHED_MEMBERS',[(x.filename,x.file_size) for x in matches])
          assert len(matches)==1, 'Original G79 ROM not uniquely present'
          pathlib.Path('claude_fast_native/g79').write_bytes(z.read(matches[0]))
          PY
      - name: Compile Claude's native CPU core and full-game controller
        run: |
          g++ -O3 -march=native -std=gnu++17 -pthread \
            -o claude_fast_native/mm_game_driver \
            claude_fast_native/mm_game_driver.cpp claude_fast_native/mm_core.cpp
          test -x claude_fast_native/mm_game_driver
      - name: Check real D8 99:99 and opening replay without scoring
        run: |
          set -euo pipefail
          mkdir -p /tmp/claude-fast-test
          printf 'e2e4\ne7e5\n' > /tmp/claude-fast-test/book_moves.txt
          printf 'MIRAGE\n' > /tmp/claude-fast-test/start_mode.txt
          printf '' > /tmp/claude-fast-test/job.txt
          timeout 35s claude_fast_native/mm_game_driver /tmp/claude-fast-test "$PWD/claude_fast_native/g79" > /tmp/claude-fast-test/stdout.log 2>&1 || rc=$?
          cat /tmp/claude-fast-test/stdout.log | tail -40
          grep -q "LEVEL D8 MMSS 9999 NATIVE_CLAUDE" /tmp/claude-fast-test/worker.out
          grep -q "BOOK_DONE 2" /tmp/claude-fast-test/worker.out
          grep -q "SEARCH_START" /tmp/claude-fast-test/worker.out
          echo "CLAUDE_NATIVE_D8_OPENING_AND_SEARCH_VALIDATED"
      - name: Replay complete archived Game 8 including queen promotions
        run: |
          set -euo pipefail
          git fetch --no-tags origin match-claude-fast
          git show origin/match-claude-fast:live/game_000008.json > /tmp/claude-fast-game8.json
          mkdir -p /tmp/claude-fast-game8
          python - <<'PY'
          import json,pathlib
          s=json.load(open('/tmp/claude-fast-game8.json'))
          moves=s['move_history_uci']
          assert len(moves)>=81 and 'g7f8q' in moves and 'c2c1q' in moves
          root=pathlib.Path('/tmp/claude-fast-game8')
          (root/'book_moves.txt').write_text('\n'.join(moves)+'\n')
          (root/'start_mode.txt').write_text('MIRAGE\n')
          (root/'job.txt').write_text('')
          print('GAME8_FULL_HISTORY_QUEEN_PROMOTIONS',len(moves),flush=True)
          PY
          timeout 65s claude_fast_native/mm_game_driver /tmp/claude-fast-game8 "$PWD/claude_fast_native/g79" > /tmp/claude-fast-game8/stdout.log 2>&1 || test "$?" -eq 124
          tail -25 /tmp/claude-fast-game8/stdout.log
          grep -q "BOOK_DONE" /tmp/claude-fast-game8/worker.out
          grep -q "SEARCH_START" /tmp/claude-fast-game8/worker.out
          test -f /tmp/claude-fast-game8/native_search_state.bin
          test -f /tmp/claude-fast-game8/native_search_state.json
          echo "GAME8_PROMOTION_REPLAY_NATIVE_CPU_SNAPSHOT_VALIDATED"


      - name: Verify eight-slot replenishment and recovery code syntax
        run: |
          python -m pip install python-chess
          python -m py_compile claude_fast_match_runner.py claude_fast_native/fast_live_sync.py claude_fast_native/fast_restore.py
          python - <<'PY'
          import tempfile, pathlib, json
          import claude_fast_match_runner as game
          oldout=game.OUT
          with tempfile.TemporaryDirectory() as temp:
              game.OUT=pathlib.Path(temp)
              game.SCHEDULER_PATH=game.OUT/'scheduler.json'
              for gid in range(1,9):
                  wd=game.OUT/('game_%06d'%gid)
                  wd.mkdir()
                  final=gid!=8
                  (wd/'status.json').write_text(json.dumps({
                      'game_id':gid,'status':'finished' if final else 'recovering',
                      'chess_result':'1-0' if final else '*'}))
              scheduler=game.GameScheduler([{} for _ in range(16)])
              ids=[scheduler.claim(slot) for slot in range(1,9)]
              assert ids==[9,10,11,12,13,14,15,8],ids
              scheduler2=game.GameScheduler([{} for _ in range(16)])
              assert [scheduler2.claim(i) for i in range(1,9)]==ids
              print('EIGHT_SLOTS_REFILLED_UNFINISHED_GAME_8_PRESERVED',ids,flush=True)
          game.OUT=oldout
          PY
