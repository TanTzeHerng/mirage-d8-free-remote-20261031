name: Mirage D8 Maia3 79M cloud engine preflight
on:
  push:
    paths:
      - '.github/workflows/mirage-maia-preflight.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MAME and python-chess
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mame
          python -m pip install --upgrade pip
          python -m pip install python-chess
          /usr/games/mame -listfull mmirage
      - name: Restore firmware without exposing it in public repository
        env:
          ROM_B64: ${{ secrets.MIRAGE_ROM_B64 }}
        run: |
          test -n "$ROM_B64"
          mkdir -p mame/roms
          printf '%s' "$ROM_B64" | base64 -d > mame/roms/mmirage.zip
          unzip -t mame/roms/mmirage.zip
      - name: Install official Maia3 79M CPU implementation
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/CSSLab/maia3.git'
      - name: Verify one genuine move from each engine (not a scored game)
        env:
          MIRAGE_EMULATOR: /usr/games/mame
          HF_HOME: ${{ runner.temp }}/huggingface
        run: python -u mirage_maia_cloud_preflight.py
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirage-maia-preflight
          if-no-files-found: warn
          path: |
            match_preflight.json
            worker.out
            job.txt
            mame_stdout.log
            mame_stderr.log
            maia_preflight_stderr.log
